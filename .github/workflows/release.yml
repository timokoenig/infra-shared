name: Release

# Manual: pick a version, get a tag and a GitHub release. A Go module has
# no artifacts; the tag is what tools require in go.mod.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create the tag and the release

jobs:
  release:
    name: Tag and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "version must look like v0.1.0"; exit 1; }

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists"; exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests
        run: go vet ./... && go test ./... -count=1 -race -timeout 5m

      - name: Release notes
        run: |
          {
            echo "## Use"
            echo
            echo '```sh'
            echo "go get github.com/$GITHUB_REPOSITORY@$VERSION && go mod tidy"
            echo '```'
          } > notes.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then extra="--prerelease"; fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --generate-notes $extra
