name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1 -race -timeout 5m

      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
